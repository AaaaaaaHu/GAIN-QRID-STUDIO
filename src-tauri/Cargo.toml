[package]
name = "gian-qrcode-id-studio"
version = "1.1.1"
description = "GIAN-QRID-STUDIO"
authors = ["you"]
edition = "2021"

[lib]
name = "gian_qrcode_id_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
